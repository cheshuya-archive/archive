<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чешуя — сравнение логотипа</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:32px;background:#f5f5f5;color:#171717;font:14px/1.5 monospace}
    h1{font-size:18px;font-weight:500;margin:0 0 24px}
    .comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:780px}
    .sample{display:grid;align-content:start;justify-items:center;gap:24px;min-height:420px;padding:24px;background:white;border:1px solid #ddd}
    .sample strong{font-weight:500}
    .large{width:162px;height:220px;object-fit:contain}
    .small{width:30px;height:40px;object-fit:contain}
    @media(max-width:600px){body{padding:16px}.comparison{gap:8px}.sample{min-height:360px;padding:12px}.large{width:min(100%,130px);height:190px}}
  </style>
</head>
<body>
  <h1>Отдельный эксперимент: контурное лого</h1>
  <div class="comparison">
    <section class="sample"><strong>Оригинал</strong><img class="large" src="../../dist/media/cheshuya-figma-logo.svg" alt="Исходный логотип"><img class="small" src="../../dist/media/cheshuya-figma-logo.svg" alt="Исходный логотип в хедере"></section>
    <section class="sample"><strong>Контур</strong><img class="large" src="cheshuya-figma-logo-outline.svg" alt="Контурный вариант логотипа"><img class="small" src="cheshuya-figma-logo-outline.svg" alt="Контурный вариант в хедере"></section>
  </div>
</body>
</html>
